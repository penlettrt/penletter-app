<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>펜레터 앱 다운로드</title>
    <script>
        var IOS_URL = "https://apps.apple.com/kr/app/%ED%8E%9C%EB%A0%88%ED%84%B0/id6828288515";
        var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.cafe24.ec.plusdnsgroup001&pcampaignid=web_share";
        var WEB_URL = "https://penletter.co.kr/";

        var ua = navigator.userAgent;

        if (/iPhone|iPad|iPod/i.test(ua) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
            window.location.replace(IOS_URL);
        } else if (/Android/i.test(ua)) {
            window.location.replace(ANDROID_URL);
        } else {
            window.location.replace(WEB_URL);
        }
    </script>
</head>
<body>
    <p>펜레터 앱으로 연결 중입니다.</p>
    <p><a href="https://apps.apple.com/kr/app/%ED%8E%9C%EB%A0%88%ED%84%B0/id6828288515">App Store</a> · <a href="https://play.google.com/store/apps/details?id=com.cafe24.ec.plusdnsgroup001&pcampaignid=web_share">Google Play</a></p>
</body>
</html>
